name: aoeyz
displayName: AOEYZ
description: 大世界手游（自研 native libAOENative/libTBUNative）

identify:
  selfDeveloperSoNames:
    - libAOENative
    - libTBUNative
    - libGameNative
  # APK 包名（binary_cache 路径里包含此字符串即可识别）
