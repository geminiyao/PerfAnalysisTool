# projects/aoeyz/business-modules.yaml
# 替代 simpleperf/simpleperf_analyzer/business_modules.py BUSINESS_MODULES_LEGACY
# 同时提供 §4 报告章节槽位定义（替代 v4_report_renderer.py MODULE_SECTIONS）

modules:
  # ========== 通用模块（项目无关，所有 Unity 项目都有）==========
  - id: wwise
    display: Wwise 音频中间件
    section: "4.3"
    sectionTitle: 音频中间件（Wwise）
    discoverMode: lib_match
    libMatch: libAkSoundEngine
    threadHint: "Wwise 工作线程 + 主线程"
    topNRemark: "战斗音效暴涨，独占一整条线程"
    probeId: probe.middleware.wwise
    sectionFriendlyName: Wwise 音频
    roiTitle: "Wwise 音频中间件审视"

  - id: ecs_burst
    display: ECS Burst Job 工作量
    section: "4.6"
    sectionTitle: ECS Burst Job 工作量
    discoverMode: lib_match
    libMatch: lib_burst_generated
    threadHint: "Job Worker × 4"
    topNRemark: "已下沉 Worker 并行，主线程不受影响"
    probeId: null
    sectionFriendlyName: ECS Burst
    roiTitle: "ECS Burst Job"

  - id: lua_vm
    display: Lua VM 解释执行
    discoverMode: sum_self
    scope: all_threads
    keywords: [luaV_execute, luaD_call, lua_pcall, luaH_get, propagatemark, luaC_step]
    threadHint: "主线程 + Lua GC"
    topNRemark: "Lua VM 解释执行"

  - id: lua_gc_worker
    display: Lua GC 工作线程
    section: "9"
    discoverMode: subtree_sum_self
    scope: lua_mtgc_worker
    keywords: [LuaMultiThreadGC_LuaGCThreadProc, lua_execute_mtgc, do_realgc]
    threadHint: "LuaMtGc Worker"
    topNRemark: "Lua GC 工作线程"
    probeId: probe.lua.mtgc.worker

  # ========== 项目特化模块（aoeyz 业务）==========
  - id: meshui
    display: MeshUI 迭代位置刷新
    section: "4.4"
    sectionTitle: 动态 UI 子树（MeshUI 等）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - MUIControlManager
      - MUILayout
      - MUIRendererBase
      - MUIText
      - MUISprite
      - MeshUIManager
      - MUIRenderable
      - MUIDefaultRenderer
      - MUISpriteSliced
      - MUILayoutRoot
      - MUILayoutManager
    threadHint: "主线程（LateUpdate）"
    topNRemark: "MUIControlManager + MUILayout.Set3DPosition 等"
    probeId: probe.csharp.meshUI
    sectionFriendlyName: MeshUI
    roiTitle: "MeshUI 子树优化"

  - id: army_line
    display: 行军线刷新（OutSideViewArmyLineMgr）
    section: "4.5"
    sectionTitle: C# 业务管理器（行军/路径刷新等）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - OutSideViewArmyLineMgr
      - OutsideLineCtrl
      - OutsideLineMesh
      - CalculateVertexJob
    threadHint: "主线程（Update）"
    topNRemark: "OutsideLineCtrl.RefreshLine / GetArmyLineID 等"
    probeId: probe.csharp.outsideViewArmyLine
    sectionFriendlyName: 行军线
    roiTitle: "行军线/路径刷新增量化"

  - id: urp_main_render
    display: URP 主线程渲染配置
    discoverMode: subtree_sum_self
    scope: main_thread
    threadHint: "主线程"
    topNRemark: "URP 主线程渲染配置"
    keywords:
      - UniversalRenderPipeline
      - RenderCameraStack
      - RenderSingleCamera
      - ScriptableRenderer_Execute
      - ExecuteRenderPass
      - ShadowPass
      - PlanarShadow
      - DrawRendererPass
      - BloomPass
      - MobileBaseRenderer
      - DrawFoliageInstanceRenderers
      - OutsideForestRenderer
      - OutsideTreeTypeRenderer
      - TBUBaseFeature
      - TBURenderGraph

  - id: rhi_const_upload
    display: RHI 常量缓冲上传
    discoverMode: subtree_sum_self
    scope: rhi_thread
    keywords: [ConstantBuffersGLES]
    threadHint: "RHI 线程"
    topNRemark: "RHI 常量缓冲上传"

  - id: rhi_drawcall
    display: RHI DrawCall 提交
    discoverMode: subtree_sum_self
    scope: rhi_thread
    keywords:
      - "GfxDeviceGLES::DrawBuffers"
      - DrawBuffersStereo
      - BeforeDrawCall
      - SetVertexStateGLES
      - ApplyGpuProgramGLES
    threadHint: "RHI 线程"
    topNRemark: "RHI DrawCall 命令吞吐"

  - id: network
    display: 网络消息处理
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - TServerManager
      - TServer_Tick
      - TServer_DecodeMessages
      - TServer_RecvMessages
      - TServer_HandleMessages
    threadHint: "主线程"
    topNRemark: "网络消息处理"
    probeId: probe.net.tserver

  # ========== Lua 业务管理器（aoeyz 业务热点）==========
  - id: map_significance
    display: 重要度管理器（MapSignificanceMgr）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - MapSignificanceMgr
    threadHint: "主线程（Lua tick / Update）"
    topNRemark: "实体增删洪峰; 任务多时易顶到 3ms/帧上限"
    probeId: probe.lua.mapSignificance

  - id: battle_head
    display: 头像管理器（BattleHeadMgr）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - BattleHeadMgr
    threadHint: "主线程（Lua tick）"
    topNRemark: "同屏头像数量驱动; 与 BattleUIManager 联动看"

  - id: map_camera
    display: 拖动视野相机（MapCameraCtrl）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - MapCameraCtrl
    threadHint: "主线程（LateUpdate）"
    topNRemark: "拖动手势触发; 静止场景应低"

  - id: lua_mgr_dispatcher
    display: Lua 主入口分发（LuaMgr.OnTick&UpdateSchedule）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - LuaMgr.OnTick
      - LuaMgr.OnLateUpdateSchedule
    threadHint: "主线程"
    topNRemark: "Lua 主入口分发开销; 子函数热点查 MapSig/BattleHead/Hud_Common"

  - id: ugui_canvas
    display: UGUI Canvas 重建（PlayerUpdateCanvases）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - PlayerUpdateCanvases
    threadHint: "主线程（PostLateUpdate）"
    topNRemark: "主场景悬浮 UI 已 MeshUI 化; >1ms/次警戒"
    probeId: probe.ugui.canvas

  - id: ecs_simulation_dispatch
    display: ECS Simulation 分发（SimulationSystemGroup）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - SimulationSystemGroup
    threadHint: "主线程"
    topNRemark: "主线程仅分发 job; >1ms 警戒（参考 ECSDependencyVisualizer）"

  - id: ecs_init_dispatch
    display: ECS Initialization 分发（InitializationSystemGroup）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - InitializationSystemGroup
    threadHint: "主线程"
    topNRemark: "主线程仅分发 job; >1ms 警戒"

  - id: res_loader
    display: 资源加载（ResManager / LoaderManagerOnFrameEnd）
    discoverMode: subtree_sum_self
    scope: main_thread
    keywords:
      - ResManager
      - LoaderManagerdOnFrameEnd
      - LoaderManagerOnFrameEnd
    threadHint: "主线程（PostLateUpdate.PlayerSendFrameComplete 子树）"
    topNRemark: "实体增删/切视野时常见; 异步加载队列与 EndOfFrame 集中加载"
