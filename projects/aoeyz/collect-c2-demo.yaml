# collect-c2-demo.yaml — C2 可组合采集演示配置（CL-10 端到端验证）
#
# 这是 C2 验收门用的 YAML：手写场景+动作+工具 → Orchestrator 执行 → 文件 + runs 写入。
# 与 collect.yaml 的区别：action.steps 声明了 Primitive 组合（C2 可组合模式）。
#
# 用法：
#   python scripts/auto_collector/collect.py --config projects/aoeyz/collect-c2-demo.yaml
#
# Schema：docs/collector/plan/collect-yaml-schema.md

# === 项目标识 ===
project:
  name: aoeyz
  package: com.tencent.aoeyz
  activity: com.tencent.aoeyz.MainActivity
  intentAction: com.aoe.EXTERNAL_PROFILE

# === 设备路径 ===
device:
  simpleperfPath: /data/local/tmp/simpleperf
  pdataDir: /storage/emulated/0/Android/data/com.tencent.aoeyz/files/doc/log/profile_data/

# === 采集工具（Driver 热插拔：tools 声明 → 对应 driver 按序启停）===
tools:
  simpleperf:
    enabled: true
    ndkDir: D:/Android/android-ndk-r21e-windows-x86_64/simpleperf
    recordOpts: "-e cpu-clock --call-graph fp --clockid boottime -f 4000"
    durationPadding: 15
  perfetto:
    enabled: true
    script: g:/AOEYZ_Trunk/Tools/AndroidPerfettoScripts/record_android_trace.py
    bufferSize: 64mb
    durationPadding: 15
    events:
      - sched
      - freq
      - idle
      - am
      - wm
      - gfx
      - view
      - binder_driver
      - hal
      - dalvik
      - camera
      - input
      - res
      - memory

# === 场景定义 ===
scenes:
  aliases:
    "VG对比":
      label: vg_compare
      scene: StressTestBattleSimpleMode
    "压力测试":
      label: stress_test
      scene: StressTestBattleSimpleMode
  default:
    label: collect
    scene: StressTestBattleSimpleMode

# === 动作：C2 Primitive 组合（可组合模式）===
# 声明 steps 后，Orchestrator 按序执行 Primitive：
#   1. enter_scene: 进入场景（Lua intent 优先，ADB tap 降级）
#   2. camera_sweep: 相机来回移动 30s（Lua intent 优先，ADB swipe 降级）
#   3. wait_duration: 等待 30s（采样窗口剩余时间）
# Drivers 在 Primitive 执行期间后台录制。
action:
  defaultDuration: 60
  steps:
    - primitive: enter_scene
      params:
        scene: StressTestBattleSimpleMode
        coord: [540, 1200]    # 屏幕坐标，用于 ADB 降级
    - primitive: camera_sweep
      params:
        duration: 30
        pattern: back_forth
    - primitive: wait_duration
      params:
        duration: 30

# === 输出配置 ===
output:
  baseDir: output/collect
  webApiBase: http://localhost:3000/api

# === 符号配置 ===
symbols:
  libDir: output/maple/symbols

# === Meta 默认值 ===
meta:
  project: aoeyz
