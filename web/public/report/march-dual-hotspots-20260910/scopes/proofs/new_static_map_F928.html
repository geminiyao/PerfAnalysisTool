function text(tag,s,cl){const e=document.createElement(tag);e.textContent=s;if(cl)e.className=cl;return e}
function render(){host.replaceChildren();let q=search.value.trim(),threshold=Number(cut.value),selected=new Set(),path=new Set();for(const n of nodes){if(q&&n.marker.toLowerCase().includes(q.toLowerCase())){selected.add(n.id);let k=n;while(k){path.add(k.id);k=by.get(k.parent)}}}document.querySelector('#matches').textContent=q?selected.size+' 个匹配调用位置':'';
 function node(n,depth){const all=kids.get(n.id)||[], children=all.filter(c=>c.ms>=threshold||path.has(c.id)),hidden=all.filter(c=>!children.includes(c));let el=document.createElement(all.length?'details':'div');el.className=(all.length?'branch':'leaf')+(selected.has(n.id)?' focus':'');let line=all.length?document.createElement('summary'):el;line.append(text('code',(selected.has(n.id)?'★ ':'')+n.marker));line.append(text('span',n.ms.toFixed(3)+' ms  | Self '+n.selfMs.toFixed(3)+' | Calls '+n.calls+(n.maxCall!==undefined?' | 最大单次 '+n.maxCall.toFixed(3)+' ms':''),'stats'));if(all.length)el.append(line);
  if(all.length){let built=false;const build=()=>{if(built)return;built=true;const div=document.createElement('div');for(const c of children)div.append(node(c,depth+1));if(hidden.length)div.append(text('div','其余 '+hidden.length+' 个直接子项：'+hidden.reduce((s,c)=>s+c.ms,0).toFixed(3)+' ms（每项低于阈值；设为 0 查看全部）','self'));div.append(text('div','本节点 Self：'+n.selfMs.toFixed(3)+' ms；父节点 = 全部直接子项 + Self','self'));el.append(div)};el.addEventListener('toggle',()=>{if(el.open)build()});if(depth<1||path.has(n.id)){build();el.open=true}}
  return el}for(const n of kids.get(-1)||[])host.append(node(n,0))}
search.value=decodeURIComponent(location.hash.slice(1))||data.defaultFocus||'';let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,150)});cut.addEventListener('change',render);render();
</script></html>
