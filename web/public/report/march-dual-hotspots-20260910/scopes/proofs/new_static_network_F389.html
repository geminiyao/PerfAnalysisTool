  if(all.length){let built=false;const build=()=>{if(built)return;built=true;const div=document.createElement('div');for(const c of children)div.append(node(c,depth+1));if(hidden.length)div.append(text('div','其余 '+hidden.length+' 个直接子项：'+hidden.reduce((s,c)=>s+c.ms,0).toFixed(3)+' ms（每项低于阈值；设为 0 查看全部）','self'));div.append(text('div','本节点 Self：'+n.selfMs.toFixed(3)+' ms；父节点 = 全部直接子项 + Self','self'));el.append(div)};el.addEventListener('toggle',()=>{if(el.open)build()});if(depth<1||path.has(n.id)){build();el.open=true}}
  return el}for(const n of kids.get(-1)||[])host.append(node(n,0))}
search.value=decodeURIComponent(location.hash.slice(1))||data.defaultFocus||'';let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,150)});cut.addEventListener('change',render);render();
</script></html>
